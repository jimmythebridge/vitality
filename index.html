<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>VITALITY · Workout Tracker</title>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-512.png"/>
<meta name="theme-color" content="#0D0D0F"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #000000; overscroll-behavior: none; }
  body { font-family: 'PPNeueBit', 'Satoshi', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; color: #E8E8EC; -webkit-font-smoothing: antialiased; }
  #root { height: 100%; }
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  input[type=number] { -moz-appearance: textfield; }
  /* iOS Safari auto-zooms on focus if an input's font-size is under 16px.
     This sets a 16px floor only on inputs that don't already specify a larger
     size inline (inline styles always win over this class, so it's a safe default). */
  input, textarea, select { font-size: 16px; }
  ::-webkit-scrollbar { width: 0; }
  button { font-family: inherit; }
  * { -webkit-tap-highlight-color: transparent; }

  @keyframes pulse-ring {
    0%   { transform: scale(1);    opacity: 0.6; }
    50%  { transform: scale(1.06); opacity: 0.2; }
    100% { transform: scale(1);    opacity: 0.6; }
  }
  @keyframes flash-in {
    0%   { opacity: 0; transform: scale(0.92); }
    100% { opacity: 1; transform: scale(1); }
  }
  .anim-flash { animation: flash-in 0.22s ease-out both; }

  .timer-ring-pulse { animation: pulse-ring 1.8s ease-in-out infinite; }

  /* ── Instagram-style press + page transitions ────────────────────────── */

  /* Press feedback: quick scale-down on touch, spring back on release.
     Applied to any tappable surface via .press-scale. */
  .press-scale {
    transition: transform 0.22s cubic-bezier(0.33, 1.3, 0.45, 1);
    -webkit-tap-highlight-color: transparent;
  }
  .press-scale:active { transform: scale(0.96); }

  /* Smaller buttons get a subtler squeeze so they don't look rubbery */
  .press-scale-sm {
    transition: transform 0.18s cubic-bezier(0.33, 1.3, 0.45, 1);
    -webkit-tap-highlight-color: transparent;
  }
  .press-scale-sm:active { transform: scale(0.92); }

  /* Page push: new view slides in from the right, like iOS/Instagram nav */
  @keyframes page-push-in {
    0%   { opacity: 0; transform: translateX(28px) scale(0.985); }
    100% { opacity: 1; transform: translateX(0)    scale(1); }
  }
  .page-push { animation: page-push-in 0.36s cubic-bezier(0.25, 0.8, 0.25, 1) both; }

  /* Page pop: returning view eases back from the left */
  @keyframes page-pop-in {
    0%   { opacity: 0; transform: translateX(-22px) scale(0.99); }
    100% { opacity: 1; transform: translateX(0)     scale(1); }
  }
  .page-pop { animation: page-pop-in 0.34s cubic-bezier(0.25, 0.8, 0.25, 1) both; }

  /* Modal sheets rise from the bottom with a slight overshoot */
  @keyframes sheet-rise {
    0%   { opacity: 0; transform: translateY(40px); }
    100% { opacity: 1; transform: translateY(0); }
  }
  .sheet-rise { animation: sheet-rise 0.38s cubic-bezier(0.25, 1.02, 0.3, 1) both; }

  @media (prefers-reduced-motion: reduce) {
    .press-scale, .press-scale-sm { transition: none; }
    .press-scale:active, .press-scale-sm:active { transform: none; }
    .page-push, .page-pop, .sheet-rise, .anim-flash { animation: none; }
  }

  @keyframes progress-sweep {
    from { stroke-dashoffset: var(--dash-start); }
    to   { stroke-dashoffset: var(--dash-end); }
  }

  "Hip Thrust","Farmers Walk","Turkish Get-Up","Box Jump","Sumo Deadlift","Hack Squat",
  "Pendlay Row","Trap Bar Deadlift","Zercher Squat","Good Morning","Nordic Curl","GHD Raise",
  "Leg Press","Goblet Squat","Lunges","Step-Up"];

function defaultTimings(exerciseName, phase) {
  // Phase-based defaults take priority over name-based lookup
  if (phase === "cooldown") return { work: 45, rest: 10 };
  if (phase === "core")     return { work: 30, rest: 15 };
  if (phase === "mobility") return { work: 30, rest: 15 };

  const isCompound = COMPOUND.includes(exerciseName);
  const isWarmup   = EXERCISE_LIBRARY.warmup.includes(exerciseName);
  const isCooldown = EXERCISE_LIBRARY.cooldown.includes(exerciseName);
  if (isWarmup)   return { work: 40, rest: 10 };
  if (isCooldown) return { work: 45, rest: 10 };
  if (isCompound) return { work: 60, rest: 45 };
  return                  { work: 45, rest: 30 };
}

// Fixed rest used specifically when moving from one exercise to the next
// within the same superset/circuit round — distinct from the rest taken
// between repeated rounds of the SAME exercise (which uses defaultTimings above).
const BETWEEN_EXERCISE_REST = 15;

// Fixed "get into position" buffer inserted before every single set, work
// or transition. Not user-editable — same for everyone, every exercise.
const PREP_TIME = 3;

function saveSessions(s) { try { localStorage.setItem(SESSIONS_KEY, JSON.stringify(s)); } catch {} }
function loadSessions()  { try { const r = localStorage.getItem(SESSIONS_KEY); return r ? JSON.parse(r) : {}; } catch { return {}; } }
function logSessionToday(name) {
  const sessions = loadSessions();
  const key = new Date().toISOString().slice(0,10);
  const existing = sessions[key] || { count: 0, names: [] };
  existing.count += 1;
  if (name && !existing.names.includes(name)) existing.names.push(name);
  sessions[key] = existing;
  saveSessions(sessions);
  return sessions;
}

  else { all[dateKey] = templateId; }
  try { localStorage.setItem(SCHEDULE_KEY, JSON.stringify(all)); } catch {}

}

function loadCustomExercises() {
  try { const r = localStorage.getItem(CUSTOM_EX_KEY); return r ? JSON.parse(r) : {warmup:[],strength:[],core:[],cooldown:[]}; }
  catch { return {warmup:[],strength:[],core:[],cooldown:[]}; }
}
function addCustomExercise(type, name) {
  const all = loadCustomExercises();
  if (!all[type]) all[type] = [];
  if (!all[type].some(e=>e.toLowerCase()===name.toLowerCase())) {
    all[type] = [...all[type], name];
    try { localStorage.setItem(CUSTOM_EX_KEY, JSON.stringify(all)); } catch {}
  }
  return all;
}

const TAG_COLORS = ["#bdf100","#A78BFA","#FFB800","#FF6B35","#5EEAD4","#F472B6","#60A5FA"];
function tagColorFor(label) {
  let hash = 0;
  for (let i=0;i<label.length;i++) hash = (hash*31 + label.charCodeAt(i)) % TAG_COLORS.length;
  return TAG_COLORS[Math.abs(hash)];
}

    try { localStorage.setItem(CUSTOM_TAGS_KEY, JSON.stringify(next)); } catch {}
    return next;
  }
  return all;
}

// Stored separately from templates, keyed by workout id. Images are resized
// and compressed to a data URL before storing — a raw iPhone photo is 3-5MB
// and localStorage caps around 5MB total, so unresized photos blow the limit
// after one or two saves.
const PHOTOS_KEY = "vitality_workout_photos_v1";
function loadPhotos() {
  try { const r = localStorage.getItem(PHOTOS_KEY); return r ? JSON.parse(r) : {}; }
  catch { return {}; }
}
function savePhoto(workoutId, dataUrl) {
  const all = loadPhotos();
  all[workoutId] = dataUrl;
  try { localStorage.setItem(PHOTOS_KEY, JSON.stringify(all)); return all; }
  catch (e) {
    // Quota exceeded — most likely too many stored photos
    alert("Couldn't save photo — storage is full. Try removing a photo from another workout.");
    return all;
  }
}
function removePhoto(workoutId) {
  const all = loadPhotos();
  delete all[workoutId];
  try { localStorage.setItem(PHOTOS_KEY, JSON.stringify(all)); } catch {}
  return all;
}

// Resize + compress an image File into a data URL suitable for localStorage.
function compressImage(file, maxWidth = 800, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function calcStats(logs) {
  if (!logs?.length) return null;
  const weights = logs.map(l => parseFloat(l.weight)).filter(w => !isNaN(w) && w > 0);
  if (!weights.length) return null;
  // Find the log entry with the max weight to estimate 1RM from its rep count (Epley formula)
  let bestLog = logs[0], bestW = 0;
  logs.forEach(l => { const w = parseFloat(l.weight); if (!isNaN(w) && w > bestW) { bestW = w; bestLog = l; } });
  const bestReps = parseFloat(bestLog.reps) || 1;
  const estOneRM = bestReps > 1 ? Math.round(bestW * (1 + bestReps/30)) : bestW;
  return {
    pb:         Math.max(...weights),
    avg:        Math.round((weights.reduce((a,b)=>a+b,0)/weights.length)*10)/10,
    lastWeight: weights[weights.length-1],
    logCount:   logs.length,
    estOneRM,
  };
}

// ─── AUDIO ───────────────────────────────────────────────────────────────────
function beep(freq=880, dur=0.12, type="sine", vol=0.4) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.start(); osc.stop(ctx.currentTime + dur);
  } catch {}
}
function beepWork() { beep(660, 0.10, "sine", 0.3); setTimeout(()=>beep(880,0.15,"sine",0.4),120); }
function beepRest() { beep(440, 0.15, "sine", 0.35); setTimeout(()=>beep(330,0.20,"sine",0.3),150); }
function beepCountdown() { beep(1047, 0.08, "sine", 0.2); }
// Distinct "10 seconds remaining" bell — a single warmer, longer tone so it's
// clearly different from the sharp 3-2-1 countdown beeps that follow it.
function beepTenSecWarning() { beep(784, 0.22, "triangle", 0.32); }

// ─── FLAT WORKOUT QUEUE ──────────────────────────────────────────────────────
// Builds a flat ordered list of "steps" from the workout structure.
// Each step: { id, phase, label, subLabel, exerciseKey, setIndex, type:"work"|"rest"|"hold" }
function buildQueue(workout, blockOrder) {
  const steps = [];
  let id = 0;

  // Build the ordered list of block descriptors to walk through.
  // If blockOrder is provided (user has dragged blocks around), use that.
  // Otherwise fall back to the default fixed sequence.
  const defaultOrder = ["warmup",
    ...workout.supersets.map((_,i)=>`ss${i}`),
    "core",
    ...(workout.customBlocks||[]).map(b=>`cb-${b.id}`),
    "cooldown",
  ];
  const order = blockOrder
    ? (() => {
        const known = new Set(defaultOrder);
        const kept = blockOrder.filter(k => known.has(k));
        const missing = defaultOrder.filter(k => !kept.includes(k));
        return [...kept, ...missing];
      })()
    : defaultOrder;

  // The 6 named segment labels for the progress bar — each block key maps to one.
  const blockSegmentMap = {};
  order.forEach((key, i) => { blockSegmentMap[key] = i; });
  const totalSegments = order.length;

  function pushWork(key, step)  { steps.push({ ...step, blockKey: key, blockSegment: blockSegmentMap[key], totalSegments, type:"work" }); }
  function pushRest(key, step)  { steps.push({ ...step, blockKey: key, blockSegment: blockSegmentMap[key], totalSegments, type:"rest" }); }

  const roleLabel = { major:"Major", peripheral:"Peripheral", mobility:"Mobility" };

  order.forEach(key => {

    // ── WARMUP ──────────────────────────────────────────────────────────────
    if (key === "warmup") {
      workout.warmup.forEach((item, i) => {
        if (!item.name) return;
        const t = item.timings || defaultTimings(item.name, "warmup");
        const nextLabel = workout.warmup[i+1]?.name || "First exercise";
        pushWork("warmup", { id: id++, phase:"warmup", label: item.name, subLabel:"Warm-up", exerciseKey:`warmup-${i}`, setIndex:0, targetReps:1, work:t.work, rest:t.rest });
        pushRest("warmup", { id: id++, phase:"warmup", label:"Rest", subLabel:`Next: ${nextLabel}`, exerciseKey:`warmup-${i}`, setIndex:0, work:t.work, rest:t.rest });
      });
      return;
    }

    // ── COOLDOWN ─────────────────────────────────────────────────────────────
    if (key === "cooldown") {
      workout.cooldown.forEach((item, i) => {
        if (!item.name) return;
        const t = item.timings || defaultTimings(item.name, "cooldown");
        pushWork("cooldown", { id: id++, phase:"cooldown", label: item.name, subLabel:"Cool-down stretch", exerciseKey:`cd-${i}`, setIndex:0, targetReps:1, work:t.work, rest:t.rest });
        if (i < workout.cooldown.length - 1) {
          pushRest("cooldown", { id: id++, phase:"cooldown", label:"Rest", subLabel:`Next: ${workout.cooldown[i+1]?.name}`, exerciseKey:`cd-${i}`, setIndex:0, work:t.work, rest:t.rest });
        }
      });
      return;
    }

    // ── SUPERSETS (ss0, ss1, ss2 …) ──────────────────────────────────────────
    if (key.startsWith("ss")) {
      const si = parseInt(key.slice(2), 10);
      const ss = workout.supersets[si];
      if (!ss) return;
      const namedSSEx = ss.exercises
        .map((ex, originalIdx) => ({ ex, originalIdx }))
        .filter(({ex}) => ex.name);
      if (!namedSSEx.length) return;
      const totalSets = namedSSEx[0]?.ex?.sets?.length || 3;
      const rLabel = roleLabel[ss.role] || `Block ${si+1}`;
      for (let setIdx = 0; setIdx < totalSets; setIdx++) {
        namedSSEx.forEach(({ex, originalIdx: ei}, listIdx) => {
          const setData = ex.sets[setIdx] || {};
          const t = ex.timings || defaultTimings(ex.name, ss.role === "mobility" ? "mobility" : "strength");
          const workTime = setData.targetTime || t.work;
          const isLastExInSet = listIdx === namedSSEx.length - 1;
          const isLastSetOfSS = setIdx === totalSets - 1;
          const nextLabel = !isLastExInSet
            ? namedSSEx[listIdx+1].ex.name
            : isLastSetOfSS ? "Next block" : `Set ${setIdx+2} · ${namedSSEx[0].ex.name}`;
          pushWork(key, { id: id++, phase:"strength", label: ex.name,
            subLabel: `${rLabel} · Set ${setIdx+1}/${totalSets}`,
            exerciseKey: `ss${si}-ex${ei}`, setIndex: setIdx, ssIndex: si, exIndex: ei,
            targetReps: setData.targetReps, work: workTime, rest: t.rest });
          pushRest(key, { id: id++, phase:"strength", label:"Rest",
            subLabel: `Next: ${nextLabel}`,
            exerciseKey: `ss${si}-ex${ei}`, setIndex: setIdx, ssIndex: si, exIndex: ei,
            work: workTime, rest: isLastExInSet ? t.rest : BETWEEN_EXERCISE_REST,
            isLastExInSet, isLastSetOfSS });
        });
      }
      return;
    }

    // ── CORE ─────────────────────────────────────────────────────────────────
    if (key === "core") {
      const coreList = workout.core || [];
      coreList.forEach((ex, ci) => {
        if (!ex.name) return;
        const t = ex.timings || defaultTimings(ex.name, "core");
        const totalSets = ex.sets?.length || 3;
        for (let setIdx = 0; setIdx < totalSets; setIdx++) {
          const setData = ex.sets[setIdx] || {};
          const workTime = setData.targetTime || t.work;
          const isLast = ci === coreList.length - 1 && setIdx === totalSets - 1;
          const isLastSetOfThisEx = setIdx === totalSets - 1;
          pushWork("core", { id: id++, phase:"core", label: ex.name,
            subLabel: `Core circuit · Round ${setIdx+1}/${totalSets}`,
            exerciseKey: `core${ci}`, setIndex: setIdx, coreIndex: ci,
            targetReps: setData.targetReps, work: workTime, rest: t.rest });
          pushRest("core", { id: id++, phase:"core", label:"Rest",
            subLabel: isLast ? "Next: Cool down" : `Next: ${coreList[(ci+1)%coreList.length]?.name || "Cool down"}`,
            exerciseKey: `core${ci}`, setIndex: setIdx, coreIndex: ci,
            work: workTime, rest: isLastSetOfThisEx ? BETWEEN_EXERCISE_REST : t.rest });
        }
      });
      return;
    }

    // ── CUSTOM BLOCKS (cb-{id}) ───────────────────────────────────────────────
    if (key.startsWith("cb-")) {
      const blockId = key.slice(3);
      const bi = (workout.customBlocks||[]).findIndex(b => b.id === blockId);
      const block = (workout.customBlocks||[])[bi];
      if (!block) return;
      const namedExercises = block.exercises
        .map((ex, originalIdx) => ({ ex, originalIdx }))
        .filter(({ex}) => ex.name);
      namedExercises.forEach(({ex, originalIdx: ei}, listIdx) => {
        const t = ex.timings || defaultTimings(ex.name, "custom");
        const totalSets = ex.sets?.length || 3;
        for (let setIdx = 0; setIdx < totalSets; setIdx++) {
          const setData = ex.sets[setIdx] || {};
          const workTime = setData.targetTime || t.work;
          const isLastEx = listIdx === namedExercises.length - 1;
          const isLastSet = setIdx === totalSets - 1;
          const nextLabel = !isLastEx
            ? namedExercises[listIdx+1].ex.name
            : isLastSet ? "Next block" : `Set ${setIdx+2} · ${namedExercises[0].ex.name}`;
          pushWork(key, { id: id++, phase:"custom", label: ex.name,
            subLabel: `${block.title} · Set ${setIdx+1}/${totalSets}`,
            exerciseKey: `cb${bi}-ex${ei}`, setIndex: setIdx, blockIndex: bi, exIndex: ei,
            targetReps: setData.targetReps, work: workTime, rest: t.rest });
          pushRest(key, { id: id++, phase:"custom", label:"Rest",
            subLabel: `Next: ${nextLabel}`,
            exerciseKey: `cb${bi}-ex${ei}`, setIndex: setIdx, blockIndex: bi, exIndex: ei,
            work: workTime, rest: isLastSet ? BETWEEN_EXERCISE_REST : t.rest });
        }
      });
      return;
    }
  });

  // Insert fixed 3-second prep before every work step.
  const withPrep = [];
  steps.forEach(step => {
    if (step.type === "work") {
      withPrep.push({
        ...step,
        id: id++,
        type: "prep",
        subLabel: `Get ready: ${step.label}`,
        work: PREP_TIME,
      });
    }
    withPrep.push(step);
  });

  return withPrep;
}

      <circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/>
      <circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/>
      <circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/>
    </svg>,
    camera: <svg {...p}><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>,
    settings: <svg {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>,
  };
  return d[name] || null;
}

// ─── CIRCULAR TIMER RING ─────────────────────────────────────────────────────
function TimerRing({ seconds, total, phase }) {
  const R = 108;
  const CIRC = 2 * Math.PI * R;
  const pct = total > 0 ? seconds / total : 1;
  const offset = CIRC * (1 - pct);
  const isRest = phase === "rest";
  const isPrep = phase === "prep";
  const color = isPrep ? "#5EEAD4" : isRest ? "#A78BFA" : "#bdf100";
  const mins = Math.floor(seconds / 60);
  const secs = seconds % 60;
  const timeStr = mins > 0 ? `${mins}:${String(secs).padStart(2,"0")}` : String(seconds);
  const warn = seconds <= 3 && seconds > 0;

  return (
    <div style={{ position:"relative", width:260, height:260, flexShrink:0 }}>
      {/* Pulse rings when warning */}
      {warn && (
        <div className="timer-ring-pulse" style={{
          position:"absolute", inset:0, borderRadius:"50%",
          border:`3px solid ${color}`, opacity:0.4,
        }}/>
      )}
      <svg width={260} height={260} style={{ position:"absolute", inset:0 }}>
        {/* Track */}
        <circle cx={130} cy={130} r={R} fill="none" stroke="#1a1a20" strokeWidth={10}/>
        {/* Progress */}
        <circle
          cx={130} cy={130} r={R}
          fill="none"
          stroke={color}
          strokeWidth={10}
          strokeLinecap="round"
          strokeDasharray={CIRC}
          strokeDashoffset={offset}
          transform="rotate(-90 130 130)"
          style={{ transition: "stroke-dashoffset 1s linear, stroke 0.3s" }}
        />
      </svg>
      {/* Centre content */}
      <div style={{
        position:"absolute", inset:0,
        display:"flex", flexDirection:"column",
        alignItems:"center", justifyContent:"center", gap:2,
      }}>
        <div style={{
          fontSize: warn ? 52 : 58,
          fontWeight: 900, fontFamily:"monospace",
          color: warn ? "#FF4444" : color,
          letterSpacing:"-2px",
          transition:"color 0.2s",
          lineHeight:1,
        }}>{timeStr}</div>
        <div style={{
          fontSize:11, fontWeight:800, letterSpacing:"0.18em",
          color: isPrep ? "#3da89a" : isRest ? "#7c6bd4" : "#7a9926",
          marginTop:4,
        }}>{isPrep ? "GET READY" : isRest ? "REST" : "WORK"}</div>
      </div>
    </div>
  );
}

// ─── RESUME PROMPT ────────────────────────────────────────────────────────────
// ─── WORKOUT TIMELINE BAR ─────────────────────────────────────────────────────
// A segmented horizontal bar showing the full workout queue. Each segment is
// one step. Completed steps are filled white, the current step is highlighted
// with a lime dot, future steps are faint dashes. Groups by phase colour.
function WorkoutTimeline({ queue, queueIdx, elapsedSeconds }) {
  const mins = Math.floor(elapsedSeconds / 60);
  const secs = elapsedSeconds % 60;
  const elapsed = `${mins}:${String(secs).padStart(2,"0")}`;

  // Build the ordered list of unique blocks from the queue's metadata.
  // Each block is one segment regardless of how many steps it contains.
  const blockKeys = [];
  const seen = new Set();
  queue.forEach(s => {
    if (s.blockKey && !seen.has(s.blockKey)) {
      seen.add(s.blockKey);
      blockKeys.push(s.blockKey);
    }
  });

  const currentBlockKey = queue[queueIdx]?.blockKey;
  const currentBlockIdx = blockKeys.indexOf(currentBlockKey);
  const pct = blockKeys.length > 0 ? Math.round((currentBlockIdx / blockKeys.length) * 100) : 0;

  // Color each segment by its phase
  function segmentColor(key) {
    if (key === "warmup")   return "#FF6B35";
    if (key === "cooldown") return "#A78BFA";
    if (key === "core")     return "#FFB800";
    if (key.startsWith("ss")) return "#bdf100";
    return "#5EEAD4"; // custom blocks
  }

  return (
    <div style={{ width:"100%", paddingBottom:8 }}>
      <div style={{ display:"flex", alignItems:"baseline", gap:8, marginBottom:8 }}>
        <span style={{ fontSize:16, fontWeight:900, color:"#E8E8EC", fontFamily:"monospace" }}>{elapsed}</span>
        <span style={{ fontSize:13, color:"#666", fontWeight:600 }}>· {pct}%</span>
      </div>
      <div style={{ display:"flex", alignItems:"center", gap:3, height:6 }}>
        {blockKeys.map((key, i) => {
          const isDone    = i < currentBlockIdx;
          const isCurrent = i === currentBlockIdx;
          const color     = segmentColor(key);
          return (
            <div key={key} style={{
              flex: 1,
              height: isCurrent ? 8 : 6,
              borderRadius: 4,
              background: isDone ? "#E8E8EC" : isCurrent ? color : color + "30",
              transition: "all 0.3s ease",
              marginTop: isCurrent ? -1 : 0,
            }}/>
          );
        })}
      </div>
    </div>
  );
}

// ─── TIMER SCREEN ─────────────────────────────────────────────────────────────
function TimerScreen({ step, secondsLeft, totalSeconds, running, onPlayPause, onSkip, onAddTime, workout, onLogSet, onLogCoreSet, onLogSimple, onExit, queue, queueIdx, elapsedSeconds, onSkipToNextExercise, onSkipToPrevStep }) {
  const isWork = step.type === "work";
  const isRest = step.type === "rest";
  const isPrep = step.type === "prep";
  const isStrength = step.phase === "strength";
  const isCore = step.phase === "core";
  const isSimple = step.phase === "warmup" || step.phase === "cooldown";

  // Bi-directional swipe: left = next step, right = previous step.
  const swipeStartX = useRef(null);
  const swipeStartY = useRef(null);
  const [swipeHint, setSwipeHint] = useState(null); // "next" | "prev" | null

  function handleTouchStart(e) {
    swipeStartX.current = e.touches[0].clientX;
    swipeStartY.current = e.touches[0].clientY;
  }
  function handleTouchEnd(e) {
    if (swipeStartX.current === null) return;
    const dx = e.changedTouches[0].clientX - swipeStartX.current;
    const dy = Math.abs(e.changedTouches[0].clientY - swipeStartY.current);
    swipeStartX.current = null;
    if (dy > 40) return; // too much vertical drift — not a swipe
    if (dx < -60 && onSkipToNextExercise) {
      setSwipeHint("next");
      setTimeout(()=>setSwipeHint(null), 600);
      onSkipToNextExercise();
    } else if (dx > 60 && onSkipToPrevStep) {
      setSwipeHint("prev");
      setTimeout(()=>setSwipeHint(null), 600);
      onSkipToPrevStep();
    }
  }

  // Reps default to the suggested target (shown grey) until the user overrides it.
  const [reps, setReps]     = useState("");
  const [weight, setWeight] = useState("");
  const repsHasValue = reps !== "";

  // Reset local inputs whenever we land on a new work step
  useEffect(() => { setReps(""); setWeight(""); }, [step.id]);

  const phaseColor = isPrep ? "#5EEAD4" : ({
    warmup:   "#FF6B35",
    strength: isRest ? "#A78BFA" : "#bdf100",
    core:     isRest ? "#A78BFA" : "#FFB800",
    cooldown: "#A78BFA",
  }[step.phase] || "#bdf100");

  const handleDone = () => {
    const repsToLog = repsHasValue ? reps : (step.targetReps ?? "");
    if (isStrength && isWork && step.ssIndex !== undefined) {
      onLogSet(step.ssIndex, step.exIndex, step.setIndex, { weight, reps: repsToLog });
    }
    if (isCore && isWork && step.coreIndex !== undefined) {
      onLogCoreSet(step.coreIndex, step.setIndex, { weight, reps: repsToLog });
    }
    if (isSimple && isWork && onLogSimple) {
      onLogSimple(step.exerciseKey, repsToLog);
    }
    onSkip();
  };

  // Explicit skip — advances to the next step WITHOUT logging anything for
  // this set. Distinct from "Set Complete", which always logs first.
  const handleSkipOnly = () => { onSkip(); };

  return (
    <div className="anim-flash" style={{
      display:"flex", flexDirection:"column", alignItems:"center",
      padding:"0 24px 32px",
      minHeight:"100%",
      background:"#0D0D0F",
    }}
      onTouchStart={handleTouchStart}
      onTouchEnd={handleTouchEnd}
    >

      {/* Progress timeline — elapsed time + segmented position bar */}
      {queue?.length > 0 && (
        <div style={{ width:"100%", padding:"12px 0 0" }}>
          <WorkoutTimeline queue={queue} queueIdx={queueIdx} elapsedSeconds={elapsedSeconds}/>
        </div>
      )}

      {/* Top bar */}
      <div style={{
        display:"flex", alignItems:"center", justifyContent:"space-between",
        width:"100%", padding:"8px 0 8px",
      }}>
        <button style={S.iconBtnSm} onClick={onExit}>
          <Icon name="back" size={20} color="#666"/>
        </button>
        <div style={{ fontSize:11, fontWeight:800, letterSpacing:"0.15em", color:"#383840" }}>
          {step.subLabel?.toUpperCase()}
        </div>
        <div style={{ width:36 }}/>
      </div>

      {/* Exercise name */}
      <div className="block-display" style={{
        fontSize: step.label.length > 18 ? 24 : 28,
        textAlign:"center",
        color:"#E8E8EC", marginBottom:4, marginTop:8,
        lineHeight:1.15,
      }}>{step.label}</div>

      {/* Phase pill */}
      <div style={{
        background: phaseColor + "1a",
        border:`1px solid ${phaseColor}44`,
        borderRadius:20, padding:"3px 12px", marginBottom:28,
        fontSize:11, fontWeight:800, color:phaseColor, letterSpacing:"0.1em",
      }}>
        {isPrep ? "GET READY" : isRest ? "REST" : step.phase === "warmup" ? "WARM UP" : step.phase === "cooldown" ? "COOL DOWN" : step.phase === "core" ? "CORE CIRCUIT" : "WORK SET"}
      </div>

      {/* Ring */}
      <TimerRing seconds={secondsLeft} total={totalSeconds} phase={step.type}/>

      {/* Log inputs — every work step gets a rep field; strength/core also get weight */}
      {isWork && (
        <div style={{
          display:"flex", alignItems:"center", gap:12,
          marginTop:24, width:"100%",
        }}>
          {(isStrength || isCore) && (
            <>
              <div style={S.logInputWrap}>
                <span style={S.logInputLabel}>KG</span>
                <input
                  style={S.logInput}
                  type="number" inputMode="decimal"
                  placeholder="—"
                  value={weight}
                  onChange={e=>setWeight(e.target.value)}
                />
              </div>
              <div style={{ fontSize:22, color:"#252530", fontWeight:300 }}>×</div>
            </>
          )}
          <div style={S.logInputWrap}>
            <span style={S.logInputLabel}>REPS</span>
            <input
              style={{...S.logInput, color: repsHasValue ? "#E8E8EC" : "#555"}}
              type="number" inputMode="numeric"
              placeholder={String(step.targetReps ?? "—")}
              value={repsHasValue ? reps : (step.targetReps ?? "")}
              onFocus={e=>{ if(!repsHasValue) e.target.select(); }}
              onChange={e=>setReps(e.target.value)}
            />
          </div>
        </div>
      )}

      {/* Controls */}
      <div style={{
        display:"flex", alignItems:"center", gap:isWork?10:16,
        marginTop: isWork ? 20 : 32,
        width:"100%",
      }}>
        {/* +30s */}
        <button style={S.controlBtnSm} onClick={()=>onAddTime(30)}>
          <Icon name="addTime" size={20} color="#555"/>
          <span style={{fontSize:11,color:"#555",fontWeight:700}}>+30s</span>
        </button>

        {/* Play / Pause */}
        <button
          style={{
            ...S.controlBtnLg,
            background: running ? "#1a1a22" : "#bdf100",
            border: running ? "2px solid #2a2a34" : "2px solid #bdf100",
          }}
          onClick={onPlayPause}
        >
          <Icon name={running?"pause":"play"} size={28} color={running?"#bdf100":"#0D0D0F"}/>
        </button>

        {/* Work steps get TWO distinct actions: Skip (no log) and Set Complete (log + advance).
            Rest and prep steps keep a single Skip button — unchanged for rest,
            teal-tinted for prep to match its own colour rather than rest's purple. */}
        {isWork ? (
          <>
            <button style={S.controlBtnSmMuted} onClick={handleSkipOnly}>
              <Icon name="skip" size={18} color="#666"/>
              <span style={{fontSize:10,color:"#666",fontWeight:700}}>Skip</span>
            </button>
            <button
              style={{ ...S.controlBtnSm, background:"#bdf1001a", border:"1px solid #bdf10044" }}
              onClick={handleDone}
            >
              <Icon name="check" size={18} color="#bdf100"/>
              <span style={{fontSize:10,color:"#bdf100",fontWeight:700}}>Set Complete</span>
            </button>
          </>
        ) : (
          <button
            style={{
              ...S.controlBtnSm,
              background: isPrep ? "#5EEAD41a" : "#A78BFA1a",
              border: isPrep ? "1px solid #5EEAD444" : "1px solid #A78BFA44",
            }}
            onClick={handleDone}
          >
            <Icon name="skip" size={20} color={isPrep ? "#5EEAD4" : "#A78BFA"}/>
            <span style={{fontSize:11,color:isPrep ? "#5EEAD4" : "#A78BFA",fontWeight:700}}>Skip</span>
          </button>
        )}
      </div>

      {/* Next preview */}
      {step.subLabel && (
        <div style={{
          marginTop:24, padding:"10px 16px",
          background:"#111115", borderRadius:10,
          border:"1px solid #1c1c22", width:"100%",
        }}>
          <div style={{fontSize:10,color:"#383840",fontWeight:800,letterSpacing:"0.12em",marginBottom:3}}>COMING UP</div>
          <div style={{fontSize:13,color:"#777",fontWeight:600}}>{step.subLabel}</div>
        </div>
      )}

      {/* Swipe hint */}
      <div style={{marginTop:16, fontSize:11, color:"#252530", fontWeight:600, letterSpacing:"0.06em"}}>
        ← → swipe to move between steps
      </div>

      {/* Brief visual confirmation when swipe fires */}
      {swipeHint && (
        <div style={{
          position:"fixed", top:"50%", left:"50%",
          transform:"translate(-50%,-50%)",
          background:"rgba(200,240,60,0.15)", border:"1px solid #bdf10044",
          borderRadius:16, padding:"12px 24px",
          color:"#bdf100", fontSize:13, fontWeight:800,
          pointerEvents:"none", zIndex:999,
        }}>
          {swipeHint === "prev" ? "← Previous step" : "Next step →"}
        </div>
      )}
    </div>
  );
}

// ─── EXERCISE PICKER ─────────────────────────────────────────────────────────

  const customList = customEx[type] || [];
  const fullList   = [...baseList, ...customList];

  const trimmedSearch = search.trim();
  const exactMatch = fullList.some(e=>e.toLowerCase()===trimmedSearch.toLowerCase());

    if (!trimmedSearch) return;

// ─── TAG PICKER (multi-select, anchored search + create new) ────────────────
function TagPicker({ selectedTags, onChange, onClose }) {
  const [search, setSearch] = useState("");
  const [customTags, setCustomTags] = useState([]);
  const inputRef = useRef(null);
  useEffect(()=>{ setTimeout(()=>inputRef.current?.focus(),100); setCustomTags(loadCustomTags()); },[]);

  const fullList = [...DEFAULT_TAGS, ...customTags];
  const filtered = fullList.filter(t=>t.label.toLowerCase().includes(search.toLowerCase()));

  const trimmedSearch = search.trim();
  const exactMatch = fullList.some(t=>t.label.toLowerCase()===trimmedSearch.toLowerCase());
  const showAddRow = trimmedSearch.length > 0 && !exactMatch;

  const isSelected = (label) => selectedTags.some(t=>t.label===label);

  function toggleTag(tag) {
    if (isSelected(tag.label)) {
      onChange(selectedTags.filter(t=>t.label!==tag.label));
    } else {
      onChange([...selectedTags, tag]);
    }
  }

  function handleAddNew() {
    if (!trimmedSearch) return;
    const newTag = { emoji:"🏷️", label:trimmedSearch };
    const updated = addCustomTag(newTag.emoji, newTag.label);
    setCustomTags(updated);
    onChange([...selectedTags, newTag]);
    setSearch("");
  }

  return (
    <Portal>
    <div style={S.overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="sheet-rise" style={S.pickerBox}>
        <div style={S.modalHeader}>
          <span style={S.modalTitle}>Workout Tags</span>
          <button style={S.iconBtnSm} onClick={onClose}><Icon name="x" size={20} color="#888"/></button>
        </div>
        <div style={S.pickerSearchWrap}>
          <input ref={inputRef} style={S.searchInput} placeholder="Search or type to add new…"
            value={search} onChange={e=>setSearch(e.target.value)}/>
        </div>
        <div style={S.exerciseList}>
          {filtered.map(tag=>{
            const selected = isSelected(tag.label);
            const color = tagColorFor(tag.label);
            return (
              <button key={tag.label} style={{...S.tagPickerItem, ...(selected?{borderColor:color+"77",background:color+"14"}:{})}}
                onClick={()=>toggleTag(tag)}>
                <span style={{display:"flex",alignItems:"center",gap:9}}>
                  <span style={{fontSize:17}}>{tag.emoji}</span>
                  <span style={{fontSize:14,fontWeight:600,color:"#E8E8EC"}}>{tag.label}</span>
                </span>
                <span style={{...S.tagCheckbox, ...(selected?{background:color,border:`1px solid ${color}`}:{})}}>
                  {selected && <Icon name="check" size={12} color="#0D0D0F"/>}
                </span>
              </button>
            );
          })}

          {filtered.length===0 && !showAddRow && (
            <div style={{color:"#444",fontSize:13,padding:"20px",textAlign:"center"}}>No tags found</div>
          )}

          {showAddRow && (
            <button style={S.addExerciseRow} onClick={handleAddNew}>
              <span style={S.addExerciseIcon}>
                <Icon name="plus" size={15} color="#0D0D0F"/>
              </span>
              <span style={{fontSize:14,fontWeight:700,color:"#FFB800"}}>
                Add "{trimmedSearch}"
              </span>
            </button>
          )}
        </div>
        <div style={{padding:"12px 16px 18px",flexShrink:0}}>
          <button className="press-scale" style={S.saveBtn} onClick={onClose}>
            <Icon name="check" size={16} color="#0D0D0F"/> Done
          </button>
        </div>
      </div>
    </div>
    </Portal>
  );
}

                {[15,30,45,60,90,120].map(v=>(
                  <button key={v}
                    style={{...S.timePill,...(val===v?S.timePillActive:{})}}
                    onClick={()=>set(v)}>{v}s</button>
                ))}
              </div>
              <input type="number" inputMode="numeric" value={val}
                onChange={e=>set(Number(e.target.value))}
                style={{...S.searchInput,marginTop:10,width:"100%"}}
                placeholder="Custom seconds"/>
            </div>
          ))}
          <button className="press-scale" style={S.saveBtn} onClick={()=>{onChange(w,r);onClose();}}>
            <Icon name="check" size={16} color="#0D0D0F"/> Apply timings

}

// ─── SET ROW ─────────────────────────────────────────────────────────────────
// A single editable chip: shows a grey suggested value until the user types
// their own, which then commits and renders in white.
function SuggestChip({ value, suggested, onChange, unit, color="#E8E8EC", type="number" }) {
  const hasValue = value !== "" && value !== null && value !== undefined;
  return (
    <input
      style={{...S.chipInput, color: hasValue ? color : "#666"}}
      type={type} inputMode={type==="number" ? "decimal" : "text"}
      value={hasValue ? value : (suggested ?? "")}
      onFocus={e=>{ if(!hasValue) e.target.select(); }}
      onChange={e=>onChange(e.target.value)}
      placeholder={String(suggested ?? "—")}
    />
  );
}

function SetRow({ setNum, data, onChange, pb }) {
  const isPB = data.loggedWeight && parseFloat(data.loggedWeight)>0 && pb && parseFloat(data.loggedWeight)>=pb;
  return (
    <div style={{...S.setRow,...(data.done?S.setRowDone:{}),...(isPB?S.setRowPB:{})}}>
      <div style={S.setNum}>{setNum}</div>
      <div style={S.setChipGrid}>
        <div style={S.chipWrap}>
          <span style={S.inputLabel}>TIME</span>
          {/* Editing here sets the PLAN (targetTime) — what the timer will count
              down during playback. This is distinct from loggedTime, which only
              gets written live during an active session via the timer screen. */}
          <SuggestChip value={data.targetTime} suggested="40"
            onChange={v=>onChange({...data,targetTime:parseInt(v,10)||0})} color="#60A5FA" unit="s"/>
        </div>
        <div style={S.chipWrap}>
          <span style={S.inputLabel}>EFFORT</span>
          <SuggestChip value={data.effort} suggested="—"
            onChange={v=>onChange({...data,effort:v})} color="#FFB800"/>
        </div>
        <div style={S.chipWrap}>
          <span style={S.inputLabel}>REPS</span>
          {/* Same as TIME above — this sets targetReps, the plan, not loggedReps. */}
          <SuggestChip value={data.targetReps} suggested="10"
            onChange={v=>onChange({...data,targetReps:parseInt(v,10)||0})} color="#E8E8EC"/>
        </div>
        <div style={S.chipWrap}>
          <span style={S.inputLabel}>KG</span>
          <SuggestChip value={data.loggedWeight} suggested="—"
            onChange={v=>onChange({...data,loggedWeight:v})} color="#bdf100"/>
          {isPB&&<span style={S.pbBadge}>PB!</span>}
        </div>
      </div>
      <button style={{...S.doneBtn,...(data.done?S.doneBtnActive:{})}}
        onClick={()=>onChange({...data,done:!data.done})}>
        <Icon name="check" size={16} color={data.done?"#0D0D0F":"#333"}/>
      </button>
    </div>
  );
}

// ─── EXERCISE BLOCK ───────────────────────────────────────────────────────────
function ExerciseBlock({ label, exercise, sets, timings, onExerciseChange, onSetsChange, onTimingsChange, history, phase }) {
  const [showPicker, setShowPicker]   = useState(false);
  const [showTimings, setShowTimings] = useState(false);
  const [showNote, setShowNote]       = useState(false);
  const [note, setNote]               = useState("");
  const stats  = calcStats(history[exercise]);
  const timing = timings || defaultTimings(exercise, phase);
  const pickerType = phase==="warmup"?"warmup":phase==="cooldown"?"cooldown":phase==="core"?"core":"strength";

  const lastSet = sets[sets.length-1];
  const addSet    = () => onSetsChange([...sets, makeSet(lastSet?.targetReps ?? 10, lastSet?.targetTime ?? 40)]);
  const removeSet = () => sets.length>1 && onSetsChange(sets.slice(0,-1));
  const updateSet = (i, v) => {
    const next = [...sets];
    next[i] = v;
    // If editing Set 1's weight, propagate it to all remaining sets
    // so you only have to type it once. Editing Set 2+ doesn't cascade.
    if (i === 0 && v.loggedWeight !== sets[0].loggedWeight) {
      for (let j = 1; j < next.length; j++) {
        next[j] = { ...next[j], loggedWeight: v.loggedWeight };
      }
    }
    onSetsChange(next);
  };

  return (
    <div style={S.exerciseBlock}>
      <div style={S.exHeader}>
        <span style={S.exLabel}>{label}</span>
        <button style={S.exSelector} onClick={()=>setShowPicker(true)}>
          <span style={{fontSize:14,fontWeight:700,color:"#E8E8EC"}}>{exercise||"Choose exercise"}</span>
          <Icon name="chevDown" size={16} color="#bdf100"/>
        </button>
      </div>

      {stats&&(
        <div style={S.statsBarLarge}>
          <div style={S.statsBarRow}>
            <span style={S.statsBarLabel}>Max Weight:</span>
            <span style={S.statsBarValue}>{stats.pb}kg</span>
          </div>
          <div style={S.statsBarRow}>
            <span style={S.statsBarLabel}>Est. 1 Rep Max:</span>
            <span style={S.statsBarValue}>{stats.estOneRM}kg</span>
          </div>
        </div>
      )}

      {/* Timing chips */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:6}}>
        <div style={{display:"flex",gap:6}}>
          <div style={S.timingChip}>
            <Icon name="timer" size={11} color="#bdf100"/>
            <span style={{color:"#bdf100"}}>{timing.work}s work</span>
          </div>
          <div style={{...S.timingChip,borderColor:"#A78BFA44",background:"#A78BFA0e"}}>
            <Icon name="timer" size={11} color="#A78BFA"/>
            <span style={{color:"#A78BFA"}}>{timing.rest}s rest</span>
          </div>
        </div>
        <button style={S.timingEditBtn} onClick={()=>setShowTimings(true)}>
          <Icon name="settings" size={13} color="#555"/>
        </button>
      </div>

      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:5}}>
        <span style={S.setCountLabel}>{sets.length} SET{sets.length!==1?"S":""}</span>
        <div style={{display:"flex",gap:4}}>
          <button style={S.countBtn} onClick={removeSet}><Icon name="minus" size={13} color="#888"/></button>
          <button style={S.countBtn} onClick={addSet}><Icon name="plus" size={13} color="#888"/></button>
        </div>
      </div>

      {sets.map((s,i)=>(
        <SetRow key={i} setNum={i+1} data={s} onChange={v=>updateSet(i,v)} pb={stats?.pb}/>
      ))}

      <button style={S.noteToggle} onClick={()=>setShowNote(!showNote)}>
        <Icon name="note" size={13} color="#555"/>
        <span style={{fontSize:12,color:"#555"}}>{showNote?"Hide note":note?"Edit note":"Add note"}</span>
      </button>
      {showNote&&(
        <textarea style={S.noteInput} placeholder="Form cues, feelings, adjustments…"
          value={note} onChange={e=>setNote(e.target.value)} rows={2}/>
      )}

      {showPicker&&<ExercisePicker type={pickerType} onSelect={onExerciseChange} onClose={()=>setShowPicker(false)} history={history}/>}
      {showTimings&&<TimingEditor work={timing.work} rest={timing.rest}
        onChange={(w,r)=>onTimingsChange({work:w,rest:r})} onClose={()=>setShowTimings(false)}/>}
    </div>
  );
}

// ─── EXERCISE ICON TILE (stand-in for a photo thumbnail) ─────────────────────
// ─── SWIPE TO DELETE (Apple-standard gesture) ────────────────────────────────
// Wraps any row; swipe left reveals a red delete action, matching iOS list behavior.
function SwipeToDelete({ children, onDelete, disabled=false }) {
  const [dragX, setDragX] = useState(0);
  const [revealed, setRevealed] = useState(false);
  const startX = useRef(0);
  const dragging = useRef(false);
  const DELETE_WIDTH = 72;

  function handleTouchStart(e) {
    if (disabled) return;
    startX.current = e.touches[0].clientX;
    dragging.current = true;
  }
  function handleTouchMove(e) {
    if (!dragging.current || disabled) return;
    const delta = e.touches[0].clientX - startX.current;
    const base = revealed ? -DELETE_WIDTH : 0;
    const next = Math.min(0, Math.max(-DELETE_WIDTH - 20, base + delta));
    setDragX(next);
  }
  function handleTouchEnd() {
    dragging.current = false;
    if (dragX < -DELETE_WIDTH/2) { setDragX(-DELETE_WIDTH); setRevealed(true); }
    else { setDragX(0); setRevealed(false); }
  }

  return (
    <div style={{ position:"relative", overflow:"hidden" }}>
      {dragX !== 0 && (
        <div style={S.swipeDeleteAction}>
          <button style={S.swipeDeleteBtn} onClick={()=>{ setDragX(0); setRevealed(false); onDelete(); }}>
            <Icon name="x" size={18} color="#fff"/>
            <span style={{fontSize:11,fontWeight:800,color:"#fff"}}>Delete</span>
          </button>
        </div>
      )}
      <div
        style={{ transform:`translateX(${dragX}px)`, transition: dragging.current ? "none" : "transform 0.2s ease", background:"#0D0D0F" }}
        onTouchStart={handleTouchStart}
        onTouchMove={handleTouchMove}
        onTouchEnd={handleTouchEnd}
        onClick={()=>{ if(revealed){ setDragX(0); setRevealed(false); } }}
      >
        {children}
      </div>
    </div>
  );
}

// ─── LONG PRESS PREVIEW (Apple-standard gesture) ─────────────────────────────
// Wraps a row; holding it shows a quick-peek card without opening the full editor.
function LongPressable({ children, previewContent, onTap }) {
  const [showPreview, setShowPreview] = useState(false);
  const timerRef = useRef(null);
  const movedRef = useRef(false);

  function start() {
    movedRef.current = false;
    timerRef.current = setTimeout(()=>{ if(!movedRef.current) setShowPreview(true); }, 450);
  }
  function cancel() { clearTimeout(timerRef.current); }
  function move() { movedRef.current = true; cancel(); }

  return (
    <>
      <div
        onTouchStart={start} onTouchMove={move} onTouchEnd={cancel}
        onMouseDown={start} onMouseUp={cancel} onMouseLeave={cancel}
        onClick={()=>{ if(!showPreview) onTap && onTap(); }}
      >
        {children}
      </div>
      {showPreview && (
        <Portal>
        <div style={S.overlay} onClick={()=>setShowPreview(false)}>
          <div style={S.previewCard} onClick={e=>e.stopPropagation()}>
            {previewContent}
            <button style={S.previewCloseBtn} onClick={()=>setShowPreview(false)}>Close</button>
          </div>
        </div>
        </Portal>
      )}
    </>
  );
}

// ─── DRAGGABLE EXERCISE LIST (reorder within a block) ────────────────────────
// Press and hold an exercise's icon tile for ~250ms to arm the drag, then move
// up or down. Uses the tile specifically so it can't conflict with the row's
// existing swipe-to-delete and long-press-preview gestures.
function DraggableList({ count, onReorder, renderItem }) {
  const [dragIdx, setDragIdx] = useState(null);
  const [dragY, setDragY] = useState(0);
  const armRef = useRef(null);
  const startYRef = useRef(0);
  const rowRefs = useRef({});

  function arm(i, clientY) {
    startYRef.current = clientY;
    armRef.current = setTimeout(()=>{ setDragIdx(i); setDragY(0); }, 250);
  }
  const cancelArm = () => clearTimeout(armRef.current);

  function move(clientY) {
    if (dragIdx === null) return;
    setDragY(clientY - startYRef.current);
    const me = rowRefs.current[dragIdx];
    if (!me) return;
    const r = me.getBoundingClientRect();
    const centre = r.top + r.height/2 + (clientY - startYRef.current);
    for (let j = 0; j < count; j++) {
      if (j === dragIdx) continue;
      const el = rowRefs.current[j];
      if (!el) continue;
      const o = el.getBoundingClientRect();
      if (centre > o.top && centre < o.bottom) {
        onReorder(dragIdx, j);
        setDragIdx(j);
        startYRef.current = clientY;
        setDragY(0);
        break;
      }
    }
  }
  function end() { cancelArm(); setDragIdx(null); setDragY(0); }

  return (
    <>
      {Array.from({length:count}, (_,i)=>(
        <div key={i} ref={el=>rowRefs.current[i]=el}
          style={{
            position:"relative",
            zIndex: dragIdx===i ? 40 : 1,
            transform: dragIdx===i ? `translateY(${dragY}px) scale(1.015)` : "none",
            transition: dragIdx===i ? "none" : "transform 0.16s ease",
            boxShadow: dragIdx===i ? "0 10px 26px rgba(0,0,0,0.55)" : "none",
            background: dragIdx===i ? "#000" : "transparent",
          }}
          onTouchMove={e=>{ if(dragIdx===i) move(e.touches[0].clientY); }}
          onTouchEnd={()=>{ if(dragIdx===i) end(); }}
          onMouseMove={e=>{ if(dragIdx===i) move(e.clientY); }}
          onMouseUp={()=>{ if(dragIdx===i) end(); }}
        >
          {renderItem(i, {
            isDragging: dragIdx===i,
            dragHandleProps: {
              onTouchStart: e=>{ e.stopPropagation(); arm(i, e.touches[0].clientY); },
              onTouchEnd: cancelArm,
              onMouseDown: e=>{ e.stopPropagation(); arm(i, e.clientY); },
              onMouseUp: cancelArm,
            },
          })}
        </div>
      ))}
    </>
  );
}

// ─── DRAGGABLE BLOCK LIST (tap-hold-and-drag reordering) ─────────────────────
// Wraps a sequence of blocks. Each block exposes a drag handle (the 6-dot grip
// in ListSectionHeader); pressing and holding that handle for ~250ms arms the
// drag, then moving your finger reorders blocks live by swapping past whichever
// block your finger is currently over. Lifting commits the new order.
function DraggableBlockList({ order, renderBlock, onReorder }) {
  const [draggingKey, setDraggingKey] = useState(null);
  const [dragY, setDragY] = useState(0);
  const armTimerRef = useRef(null);
  const startYRef = useRef(0);
  const rowRefs = useRef({});
  const orderRef = useRef(order);
  orderRef.current = order;

  function armDrag(key, clientY) {
    startYRef.current = clientY;
    armTimerRef.current = setTimeout(()=>{
      setDraggingKey(key);
      setDragY(0);
    }, 250);
  }
  function cancelArm() {
    clearTimeout(armTimerRef.current);
  }
  function handleMove(clientY) {
    if (!draggingKey) return;
    const delta = clientY - startYRef.current;
    setDragY(delta);

    // Find which other block's row centre we've crossed, and swap if so.
    const myKey = draggingKey;
    const myEl = rowRefs.current[myKey];
    if (!myEl) return;
    const myRect = myEl.getBoundingClientRect();
    const myCentre = myRect.top + myRect.height/2 + delta;

    for (const otherKey of orderRef.current) {
      if (otherKey === myKey) continue;
      const otherEl = rowRefs.current[otherKey];
      if (!otherEl) continue;
      const r = otherEl.getBoundingClientRect();
      const otherCentre = r.top + r.height/2;
      if (myCentre > r.top && myCentre < r.bottom) {
        onReorder(myKey, otherKey);
        startYRef.current = clientY;
        setDragY(0);
        break;
      }
    }
  }
  function handleEnd() {
    cancelArm();
    setDraggingKey(null);
    setDragY(0);
  }

  return (
    <>
      {order.map(key=>(
        <div
          key={key}
          ref={el=>rowRefs.current[key]=el}
          style={{
            position:"relative",
            transform: draggingKey===key ? `translateY(${dragY}px) scale(1.01)` : "none",
            zIndex: draggingKey===key ? 50 : 1,
            transition: draggingKey===key ? "none" : "transform 0.15s ease",
            boxShadow: draggingKey===key ? "0 8px 24px rgba(0,0,0,0.5)" : "none",
            background: draggingKey===key ? "#0D0D0F" : "none",
          }}
          onTouchStartCapture={e=>{}}
          onTouchMove={e=>{ if(draggingKey===key) handleMove(e.touches[0].clientY); }}
          onTouchEnd={()=>{ if(draggingKey===key) handleEnd(); }}
          onMouseMove={e=>{ if(draggingKey===key) handleMove(e.clientY); }}
          onMouseUp={()=>{ if(draggingKey===key) handleEnd(); }}
        >
          {renderBlock(key, {
            dragHandleProps: {
              onTouchStart: e=>{ e.stopPropagation(); armDrag(key, e.touches[0].clientY); },
              onTouchEnd: cancelArm,
              onMouseDown: e=>{ e.stopPropagation(); armDrag(key, e.clientY); },
              onMouseUp: cancelArm,
            },
            isDragging: draggingKey===key,
          })}
        </div>
      ))}
    </>
  );
}

}

// ─── COLLAPSIBLE EXERCISE ROW (single-scroll list style) ─────────────────────

  const completedSets = sets.filter(s=>s.done).length;
  const firstSet = sets[0] || {};
  const hasReps = (firstSet.targetReps ?? 0) > 1;
  const stats = calcStats(history[exercise]);
  const pickerType = phase==="warmup"?"warmup":phase==="cooldown"?"cooldown":phase==="core"?"core":"strength";

  const summaryText = `${sets.length}x sets`;

  const previewContent = (
    <div>
      <div className="block-display" style={{fontSize:18,color:"#E8E8EC",marginBottom:10}}>{exercise || "Exercise"}</div>
      {stats ? (
        <div style={{display:"flex",flexDirection:"column",gap:6}}>
          <div style={S.statsBarRow}><span style={S.statsBarLabel}>Max Weight:</span><span style={S.statsBarValue}>{stats.pb}kg</span></div>
          <div style={S.statsBarRow}><span style={S.statsBarLabel}>Est. 1 Rep Max:</span><span style={S.statsBarValue}>{stats.estOneRM}kg</span></div>
          <div style={S.statsBarRow}><span style={S.statsBarLabel}>Last session:</span><span style={{...S.statsBarValue,color:"#999"}}>{stats.lastWeight}kg</span></div>
        </div>
      ) : (
        <div style={{fontSize:13,color:"#666"}}>No history yet for this exercise.</div>
      )}
      <div style={{marginTop:12,fontSize:12,color:"#555"}}>{summaryText} · {hasReps?`${firstSet.targetReps} reps · `:""}{firstSet.targetTime ?? 40}s</div>
    </div>
  );

  return (
    <SwipeToDelete onDelete={onDelete} disabled={!onDelete}>
      <div style={S.listRowWrap}>
        <LongPressable previewContent={previewContent} onTap={()=>setOpen(o=>!o)}>
          <div style={S.listRow}>
            <span style={{...S.exDragHandle, ...(isDragging?{opacity:1}:{})}} {...dragHandleProps}>
              <ExerciseTile phase={phase}/>
            </span>

            {/* TITLE — separate tap target, opens exercise picker to swap */}
            <button
              style={S.exTitleTapZone}
              onClick={e=>{ e.stopPropagation(); setShowPicker(true); }}
              onTouchStart={e=>e.stopPropagation()}
              onMouseDown={e=>e.stopPropagation()}
            >
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                {label && <span style={{fontSize:10,fontWeight:900,color:"#3a3a44",letterSpacing:"0.1em",flexShrink:0}}>{label}</span>}
                <span style={{fontSize:15,fontWeight:700,color:"#E8E8EC",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>
                  {exercise || "Choose exercise"}
                </span>
              </div>
              {completedSets>0 && (
                <span style={{fontSize:11,color:"#bdf100",fontWeight:700,marginTop:4,display:"block"}}>
                  {completedSets}/{sets.length} done
                </span>
              )}
            </button>

            {/* REPS — inline editable, applies to all sets on change */}
            <div
              style={S.exCountTapZone}
              onTouchStart={e=>e.stopPropagation()}
              onMouseDown={e=>e.stopPropagation()}
              onClick={e=>e.stopPropagation()}
            >
              <input
                style={S.exCountInput}
                type="number" inputMode="numeric" size={2} maxLength={3}
                value={firstSet.targetReps ?? ""}
                placeholder="—"
                onChange={e=>{
                  const val = parseInt(e.target.value,10)||0;
                  onSetsChange(sets.map(s=>({...s,targetReps:val})));
                }}
              />
              <span style={S.exCountLabel}>reps</span>
            </div>

            {/* TIME — inline editable, applies to all sets on change */}
            <div
              style={S.exCountTapZone}
              onTouchStart={e=>e.stopPropagation()}
              onMouseDown={e=>e.stopPropagation()}
              onClick={e=>e.stopPropagation()}
            >

                style={S.exCountInput}
                type="number" inputMode="numeric" size={2} maxLength={3}
                value={firstSet.targetTime ?? ""}
                placeholder="—"
                onChange={e=>{
                  const val = parseInt(e.target.value,10)||0;
                  onSetsChange(sets.map(s=>({...s,targetTime:val})));
                }}
              />
              <span style={S.exCountLabel}>sec</span>

              <Icon name="chevDown" size={16} color="#555"/>
            </span>

          <div className="anim-flash" style={{padding:"0 0 12px"}}>
            <ExerciseBlock
              label={label || "EXERCISE"}
              exercise={exercise} sets={sets} timings={timings}
              onExerciseChange={onExerciseChange}
              onSetsChange={onSetsChange}

          <ExercisePicker type={pickerType} onSelect={onExerciseChange} onClose={()=>setShowPicker(false)} history={history}/>

}

// ─── WEEK STRIP (Mon-Sun, completion badges) ─────────────────────────────────
function WeekStrip({ sessions, onDayTap }) {
  const today = new Date();
  const dow = (today.getDay() + 6) % 7;
  const monday = new Date(today);
  monday.setDate(today.getDate() - dow);
  const todayKey = today.toISOString().slice(0,10);

  const days = Array.from({length:7}, (_,i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const key = d.toISOString().slice(0,10);
    return { key,
      label: d.toLocaleDateString("en-GB",{weekday:"short"}),
      num: d.getDate(),
      isToday: key === todayKey,
      done: !!sessions[key] };
  });

  return (
    <div style={S.wkGrid}>
      {days.map(d=>(
        <div key={"l"+d.key} className="ui-bit" style={S.wkLabel}>{d.label}</div>
      ))}
      {days.map(d=>(
        <button key={d.key} className="ui-bit press-scale-sm"
          style={{...S.wkCell, ...cellState(d.done, d.isToday)}}
          onClick={()=>onDayTap && onDayTap(d.key)}>
          {d.num}
        </button>
      ))}
    </div>
  );
}

// Shared calendar cell states (week strip + month grid):
//   today            -> yellow outline
//   complete         -> grey transparent fill + grey outline
//   today + complete -> grey transparent fill + yellow outline
function cellState(done, isToday) {
  if (done && isToday) return { background:CAL_FILL, borderColor:ACCENT };
  if (done)            return { background:CAL_FILL, borderColor:CAL_STROKE };
  if (isToday)         return { background:"transparent", borderColor:ACCENT };
  return                      { background:"transparent", borderColor:"rgba(207,207,207,0)" };
}

// ─── CALENDAR MODULE ──────────────────────────────────────────────────────────
function CalendarModule({ sessions, schedule={}, templates=[], onDayTap }) {
  const [viewDate, setViewDate] = useState(new Date());
  const year  = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const monthName = viewDate.toLocaleDateString("en-GB",{month:"long"}).toUpperCase();

  const firstDay = new Date(year, month, 1);
  // Monday-first index (0=Mon ... 6=Sun)
  const startOffset = (firstDay.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const todayKey = new Date().toISOString().slice(0,10);
  const cells = [];
  for (let i = 0; i < startOffset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const keyFor = (d) => `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

  return (
    <div style={S.calendarCard}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18}}>
        <span className="block-display" style={{fontSize:26,color:"#E8E8EC"}}>{monthName}</span>
        <div style={{display:"flex",gap:6}}>
          <button style={S.calNavBtn} onClick={()=>setViewDate(new Date(year,month-1,1))}>
            <Icon name="back" size={15} color="#666"/>
          </button>
          <button style={S.calNavBtn} onClick={()=>setViewDate(new Date(year,month+1,1))}>
            <span style={{display:"flex",transform:"rotate(-90deg)"}}><Icon name="chevDown" size={15} color="#666"/></span>
          </button>
        </div>
      </div>
      <div style={S.calWeekRow}>
        {["M","T","W","T","F","S","S"].map((d,i)=>(
          <div key={i} style={S.calWeekDay}>{d}</div>
        ))}
      </div>
      <div style={S.calGrid}>
        {cells.map((d,i)=>{
          if (d===null) return <div key={i} style={S.calCell}/>;
          const key = keyFor(d);
          const isToday = key === todayKey;
          const isCompleted = !!sessions[key];
          const isScheduled = !!schedule[key];
          return (
            <button key={i} style={S.calCellBtn} onClick={()=>onDayTap && onDayTap(key)}>
              <div style={{
                ...S.calDayNum,
                ...(isToday ? S.calDayToday : {}),
                ...(isCompleted && !isToday ? S.calDayLogged : {}),
              }}>
                {d}
              </div>
              {isCompleted ? (
                <div style={{...S.calDot, background: isToday ? "#E8E8EC" : "#bdf100"}}/>
              ) : isScheduled ? (
                <div style={S.calDotScheduled}/>
              ) : null}
            </button>
          );
        })}
      </div>
    </div>
  );
}

// ─── HOME MONTH CALENDAR ─────────────────────────────────────────────────────
function HomeCalendar({ sessions, onDayTap }) {
  const today = new Date();
  const year = today.getFullYear(), month = today.getMonth();

  const startOffset = (new Date(year, month, 1).getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const keyFor = d => `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

  const cells = [];
  for (let i=0;i<startOffset;i++) cells.push(null);

  return (

  const firstDay = new Date(year, month, 1);
  const startOffset = (firstDay.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const todayKey = new Date().toISOString().slice(0,10);
  const cells = [];
  for (let i=0;i<startOffset;i++) cells.push(null);
  for (let d=1;d<=daysInMonth;d++) cells.push(d);
  const keyFor = (d) => `${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

  return (
    <Portal>
    <div style={S.overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="sheet-rise" style={{...S.modalBox, maxHeight:"auto"}}>
        <div style={S.modalHeader}>
          <span style={S.modalTitle}>Schedule "{tpl.name}"</span>
          <button style={S.iconBtnSm} onClick={onClose}><Icon name="x" size={20} color="#888"/></button>
        </div>
        <div style={{padding:"14px 18px 24px"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}>
            <span className="block-display" style={{fontSize:22,color:"#E8E8EC"}}>{monthName}</span>
            <div style={{display:"flex",gap:6}}>
              <button style={S.calNavBtn} onClick={()=>setViewDate(new Date(year,month-1,1))}>
                <Icon name="back" size={15} color="#666"/>
              </button>
              <button style={S.calNavBtn} onClick={()=>setViewDate(new Date(year,month+1,1))}>
                <span style={{display:"flex",transform:"rotate(-90deg)"}}><Icon name="chevDown" size={15} color="#666"/></span>
              </button>
            </div>
          </div>
          <div style={S.calWeekRow}>
            {["M","T","W","T","F","S","S"].map((d,i)=><div key={i} style={S.calWeekDay}>{d}</div>)}
          </div>
          <div style={S.calGrid}>
            {cells.map((d,i)=>{
              if (d===null) return <div key={i} style={S.calCell}/>;
              const key = keyFor(d);
              const isToday = key === todayKey;
              return (
                <button key={i} style={{...S.calCell, cursor:"pointer", background:"none", border:"none"}}
                  onClick={()=>onConfirm(key)}>
                  <div style={{...S.calDayNum, ...(isToday?S.calDayToday:{})}}>{d}</div>
                </button>
              );
            })}
          </div>
        </div>
      </div>
    </div>
    </Portal>
  );
}

// ─── DAY DETAIL SHEET (tap a calendar day) ───────────────────────────────────
function DayDetailSheet({ dateKey, sessions, schedule, templates, onClose, onOpenWorkout, onClearSchedule }) {
  const dateObj = new Date(dateKey + "T00:00:00");
  const dateLabel = dateObj.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
  const session = sessions[dateKey];
  const scheduledId = schedule[dateKey];
  const scheduledTpl = scheduledId ? templates.find(t=>t.id===scheduledId) : null;
  const isCompleted = !!session;

  return (
    <Portal>
    <div style={S.overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="sheet-rise" style={{...S.modalBox, maxHeight:"auto"}}>
        <div style={S.modalHeader}>
          <span style={S.modalTitle}>{dateLabel}</span>
          <button style={S.iconBtnSm} onClick={onClose}><Icon name="x" size={20} color="#888"/></button>
        </div>
        <div style={{padding:"14px 18px 28px",display:"flex",flexDirection:"column",gap:14}}>

          {isCompleted && (
            <div style={S.dayDetailCard}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                <span style={S.dayDetailDot}/>
                <span style={{fontSize:12,fontWeight:800,color:"#bdf100",letterSpacing:"0.08em"}}>COMPLETED</span>
              </div>
              <div style={{fontSize:14,color:"#ccc"}}>
                {session.names?.length ? session.names.join(", ") : `${session.count} session${session.count!==1?"s":""} logged`}
              </div>
            </div>
          )}

          {scheduledTpl && (
            <div style={{...S.dayDetailCard, borderStyle:"dashed"}}>
              <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
                <span style={S.dayDetailDotOutline}/>
                <span style={{fontSize:12,fontWeight:800,color:"#999",letterSpacing:"0.08em"}}>SCHEDULED</span>
              </div>
              <button style={{display:"flex",alignItems:"center",justifyContent:"space-between",width:"100%",background:"none",border:"none",cursor:"pointer",padding:0}}
                onClick={()=>onOpenWorkout(scheduledTpl)}>
                <span style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:18}}>{scheduledTpl.emoji}</span>
                  <span className="block-display" style={{fontSize:16,color:"#E8E8EC"}}>{scheduledTpl.name}</span>
                </span>
                <span style={{display:"flex",transform:"rotate(-90deg)"}}><Icon name="chevDown" size={16} color="#555"/></span>
              </button>
              <button style={S.dayDetailClearBtn} onClick={onClearSchedule}>Remove from schedule</button>
            </div>
          )}

          {!isCompleted && !scheduledTpl && (
            <div style={{color:"#444",fontSize:13,padding:"20px",textAlign:"center"}}>
              Nothing logged or scheduled for this day.
            </div>
          )}
        </div>
      </div>
    </div>
    </Portal>
  );
}

// ─── PROGRESS RING (header) ──────────────────────────────────────────────────
function ProgressRing({ total, done }) {
  const pct=total===0?0:Math.round((done/total)*100);
  const r=28,circ=2*Math.PI*r,offset=circ-(pct/100)*circ;
  return (
    <div style={{position:"relative",width:64,height:64,flexShrink:0}}>
      <svg width={64} height={64}>
        <circle cx={32} cy={32} r={r} fill="none" stroke="#1a1a1f" strokeWidth={5}/>
        <circle cx={32} cy={32} r={r} fill="none" stroke="#bdf100" strokeWidth={5}
          strokeDasharray={circ} strokeDashoffset={offset}
          strokeLinecap="round" transform="rotate(-90 32 32)"
          style={{transition:"stroke-dashoffset 0.5s ease"}}/>
      </svg>
      <div style={{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",fontSize:12,fontWeight:800,color:"#bdf100",fontFamily:"monospace"}}>
        {pct}%
      </div>
    </div>
  );
}

// ─── HISTORY PANEL ───────────────────────────────────────────────────────────
function HistoryPanel({ history, onClose }) {
  const exercises=Object.keys(history).filter(k=>history[k]?.length>0);
  return (
    <Portal>
    <div style={S.overlay} onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="sheet-rise" style={{...S.modalBox,maxHeight:"90vh"}}>
        <div style={S.modalHeader}>
          <span style={S.modalTitle}>Exercise History</span>
          <button style={S.iconBtnSm} onClick={onClose}><Icon name="x" size={20} color="#888"/></button>
        </div>
        {exercises.length===0?(
          <div style={{color:"#444",fontSize:14,padding:"40px 20px",textAlign:"center"}}>No history yet.</div>
        ):(
          <div style={{overflowY:"auto",padding:"8px 16px 32px",display:"flex",flexDirection:"column",gap:12}}>
            {exercises.map(ex=>{
              const stats=calcStats(history[ex]);
              const logs=history[ex];
              return (
                <div key={ex} style={S.historyItem}>
                  <div style={{fontSize:15,fontWeight:800,color:"#E8E8EC",marginBottom:8}}>{ex}</div>
                  <div style={{display:"flex",gap:12,marginBottom:10,flexWrap:"wrap"}}>
                    <span style={{display:"flex",alignItems:"center",gap:4,fontSize:12,fontWeight:700,color:"#FFB800"}}>
                      <Icon name="trophy" size={12} color="#FFB800"/> PB {stats.pb}kg
                    </span>
                    <span style={{display:"flex",alignItems:"center",gap:4,fontSize:12,color:"#888"}}>
                      <Icon name="history" size={12} color="#888"/> Avg {stats.avg}kg
                    </span>
                    <span style={{fontSize:12,color:"#444"}}>{logs.length} session{logs.length!==1?"s":""}</span>
                  </div>
                  <div style={{display:"flex",flexDirection:"column",gap:5}}>
                    {logs.slice(-5).reverse().map((l,i)=>(
                      <div key={i} style={{display:"flex",alignItems:"center",gap:10,padding:"5px 8px",background:"#0a0a0e",borderRadius:7}}>
                        <span style={{fontSize:11,color:"#444",width:48,flexShrink:0}}>{new Date(l.date).toLocaleDateString("en-GB",{day:"2-digit",month:"short"})}</span>
                        <span style={{fontSize:13,fontWeight:600,color:"#888",fontFamily:"monospace"}}>{l.weight}kg × {l.reps}</span>
                        {i===0&&parseFloat(l.weight)===stats.pb&&<span style={{background:"#FFB800",color:"#0D0D0F",fontSize:9,fontWeight:900,borderRadius:4,padding:"2px 5px"}}>PB</span>}
                      </div>
                    ))}
                  </div>
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
    </Portal>
  );
}

// ─── SAVED WORKOUT TEMPLATES (home carousel) ────────────────────────────────
// New unified set shape — every exercise gets both a rep target and a timer,
// regardless of type. targetReps/targetTime are suggested (grey); logged* are
// what the user actually typed (white) once confirmed.
const makeSet = (targetReps=10, targetTime=40) => ({
  targetReps, targetTime,
  loggedReps: "", loggedWeight: "", loggedTime: "", effort: "",
  done: false,
});
// Builds an exercise with N sets, each carrying the given suggested targets.
const mkEx = (name, targetReps=10, targetTime=40, setCount=3) => ({
  name,
  sets: Array.from({length:setCount}, () => makeSet(targetReps, targetTime)),
  timings: null,
});

      supersets: [
        { role:"major",      exercises:[mkEx("Goblet Squat",12,45,2), mkEx("Glute Bridge",14,45,2)] },
        { role:"peripheral", exercises:[mkEx("Turkish Get-Up",6,50,2), mkEx("Dead Bug",1,40,2)] },
        { role:"mobility",   exercises:[mkEx("Wall Slides",1,40,2), mkEx("Bear Crawl",1,40,2)] },
      ],
      core: [mkEx("Dead Bug",1,40,3), mkEx("Hollow Hold",1,40,3), mkEx("Bird Dog",1,40,3)],
